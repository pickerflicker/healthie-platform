name: healthie-platform
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: healthie
      POSTGRES_PASSWORD: healthie_local_only
      POSTGRES_DB: healthie_development
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthie -d healthie_development"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ${HEALTHIE_SOURCE_DIR:-.}
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["${HEALTHIE_SOURCE_DIR:-.}:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
